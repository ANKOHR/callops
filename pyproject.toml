[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "callops"
version = "0.1.0"
description = "A deterministic simulated call operations console with a human approval gate"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
callops = "callops.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
callops = ["scenarios/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
